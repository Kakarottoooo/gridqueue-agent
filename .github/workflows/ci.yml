name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests and evals
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: python -m pip install -e "backend[dev]"

      - name: Ingest fixture data
        run: python scripts/ingest_fixture.py

      - name: Seed flexibility rules
        run: python scripts/seed_flexibility_rules.py

      - name: Seed watcher sources
        run: python scripts/seed_watch_sources.py

      - name: Seed lead-time KB
        run: python scripts/seed_lead_time_kb.py

      - name: Run backend tests
        run: python -m pytest backend/tests

      - name: Run deterministic evals
        run: python evals/run_evals.py

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          BACKEND_API_URL: http://127.0.0.1:8000
